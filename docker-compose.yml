services:
  chattikovia-redis:
    image: redis:7-alpine
    container_name: tiko-chattikovia-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - chattikovia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  chattikovia-api:
    build: .
    container_name: tiko-chattikovia-api
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      chattikovia-redis:
        condition: service_healthy
    volumes:
      - chattikovia_uploads:/app/uploads
      - chattikovia_logs:/app/logs
    env_file:
      - .env
    environment:
      PORT: "5000"
      NODE_ENV: "production"
      UPLOAD_DIR: "/app/uploads"
      REDIS_URL: "redis://chattikovia-redis:6379"
      TZ: "Asia/Ho_Chi_Minh"
    command: sh -c "npx prisma db push --accept-data-loss && (npx prisma db execute --file prisma/applyRLS.sql --schema prisma/schema.prisma || true) && npm run start"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chattikovia_redis_data:
  chattikovia_uploads:
  chattikovia_logs:
